<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيانات العاملين شركة الدلتا للسكر</title>
    <!-- مكتبة قراءة ملفات الإكسيل SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            --header-gradient: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 100%);
            --header-shadow: rgba(30, 58, 138, 0.3);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --blue-primary: #1d4ed8;
            --blue-header: #1e3a8a;
            --blue-light: #eff6ff;
            --gray-light: #f8fafc;
            --gray-border: #cbd5e1;
            --input-bg: #ffffff;
            --dropdown-bg: #ffffff;
            --dropdown-border-bottom: #f1f5f9;
            --pink-light: #fce7f3;
            --pink-hover: #fbcfe8;
            --pink-text: #9d174d;
            --pink-border: #f472b6;
            --green-light: #dcfce7;
            --green-hover: #bbf7d0;
            --green-text: #166534;
            --green-border: #86efac;
        }

        body[data-theme="midnight-dark"] {
            --bg-gradient: linear-gradient(135deg, #050811 0%, #0f172a 55%, #1e1b4b 100%);
            --header-gradient: linear-gradient(135deg, #1e1b4b 0%, #3730a3 100%);
            --header-shadow: rgba(55, 48, 163, 0.45);
            --card-bg: #111827;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --blue-primary: #60a5fa;
            --blue-header: #93c5fd;
            --blue-light: #1e293b;
            --gray-light: #1f2937;
            --gray-border: #374151;
            --input-bg: #0f172a;
            --dropdown-bg: #1e293b;
            --dropdown-border-bottom: #334155;
        }

        body[data-theme="emerald-delta"] {
            --bg-gradient: linear-gradient(135deg, #042f2e 0%, #064e3b 55%, #115e59 100%);
            --header-gradient: linear-gradient(135deg, #065f46 0%, #0d9488 100%);
            --header-shadow: rgba(13, 148, 136, 0.35);
            --card-bg: #f0fdfa;
            --text-main: #0f2922;
            --text-muted: #3f6259;
            --blue-primary: #0f766e;
            --blue-header: #064e3b;
            --blue-light: #ccfbf1;
            --gray-light: #e6fffa;
            --gray-border: #99f6e4;
            --input-bg: #ffffff;
            --dropdown-bg: #ffffff;
            --dropdown-border-bottom: #ccfbf1;
        }

        body[data-theme="burgundy-amber"] {
            --bg-gradient: linear-gradient(135deg, #2a0a18 0%, #4c1125 55%, #78350f 100%);
            --header-gradient: linear-gradient(135deg, #881337 0%, #b45309 100%);
            --header-shadow: rgba(180, 83, 9, 0.35);
            --card-bg: #fffbeb;
            --text-main: #29151c;
            --text-muted: #78350f;
            --blue-primary: #b45309;
            --blue-header: #881337;
            --blue-light: #fef3c7;
            --gray-light: #fef9ee;
            --gray-border: #fde68a;
            --input-bg: #ffffff;
            --dropdown-bg: #ffffff;
            --dropdown-border-bottom: #fef3c7;
        }

        body[data-theme="twilight-violet"] {
            --bg-gradient: linear-gradient(135deg, #1e1035 0%, #3b0764 55%, #4c1d95 100%);
            --header-gradient: linear-gradient(135deg, #5b21b6 0%, #7e22ce 100%);
            --header-shadow: rgba(126, 34, 206, 0.38);
            --card-bg: #faf5ff;
            --text-main: #24113d;
            --text-muted: #6b21a8;
            --blue-primary: #7e22ce;
            --blue-header: #4c1d95;
            --blue-light: #f3e8ff;
            --gray-light: #f5f0ff;
            --gray-border: #d8b4fe;
            --input-bg: #ffffff;
            --dropdown-bg: #ffffff;
            --dropdown-border-bottom: #f3e8ff;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        
        body { 
            background: var(--bg-gradient);
            min-height: 100vh;
            padding: 15px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            color: var(--text-main);
            transition: background 0.3s ease, color 0.3s ease;
        }

        .app-card { 
            background: var(--card-bg); 
            width: 100%; 
            max-width: 800px; 
            border-radius: 16px; 
            padding: 18px 22px; 
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: background 0.3s ease;
        }
        
        /* المستطيل التفاعلي للعنوان الرئيسي بداخل زر الإضافة */
        .main-header-box {
            position: relative;
            background: var(--header-gradient);
            border-radius: 12px;
            padding: 10px 48px;
            text-align: center;
            color: #ffffff;
            box-shadow: 0 4px 15px var(--header-shadow);
            margin-bottom: 12px;
            cursor: pointer;
            overflow: hidden;
            transition: box-shadow 0.2s ease, background 0.3s ease;
        }
        .main-header-box input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 10;
            border-radius: 12px;
        }
        .add-badge {
            font-size: 0.72rem;
            background: rgba(255, 255, 255, 0.2);
            padding: 1px 8px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .main-header-title {
            font-size: 1.25rem;
            font-weight: 800;
            line-height: 1.2;
        }

        /* زر الترس أعلى اليسار */
        .settings-gear-btn {
            position: absolute;
            top: 50%;
            left: 10px;
            transform: translateY(-50%);
            z-index: 25;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.45);
            background: rgba(255, 255, 255, 0.18);
            color: #ffffff;
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .settings-gear-btn:hover {
            background: rgba(255, 255, 255, 0.32);
            transform: translateY(-50%) rotate(45deg);
        }

        /* نافذة الإعدادات والسمات المنبثقة فوق كل العناصر بدون أي تداخل */
        .settings-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(3px);
            z-index: 50000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .hidden-menu {
            display: none !important;
        }
        .settings-menu-card {
            width: 100%;
            max-width: 360px;
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--gray-border);
            border-radius: 18px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.55);
            overflow: hidden;
            text-align: right;
            animation: popInMenu 0.18s ease-out;
        }
        @keyframes popInMenu {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .settings-menu-header {
            background: var(--header-gradient);
            color: #ffffff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.95rem;
            font-weight: 800;
        }
        .settings-menu-close {
            background: rgba(255, 255, 255, 0.22);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 8px;
            width: 28px;
            height: 28px;
            font-size: 0.9rem;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            line-height: 1;
        }
        .settings-menu-close:hover {
            background: rgba(255, 255, 255, 0.38);
        }
        .settings-menu-content {
            padding: 14px;
            background: var(--card-bg);
        }
        .settings-menu-title {
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--text-muted);
            padding: 0 4px 8px;
        }
        .theme-list-stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .theme-option-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 11px;
            border: 1px solid var(--gray-border);
            background: var(--gray-light);
            color: var(--text-main);
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.18s ease;
        }
        .theme-option-btn:hover {
            background: var(--blue-light);
            border-color: var(--blue-primary);
        }
        .theme-option-btn.active-theme {
            border-color: var(--blue-primary);
            background: var(--blue-light);
            color: var(--blue-primary);
            box-shadow: inset 0 0 0 1.5px var(--blue-primary);
        }
        .theme-option-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .theme-check-mark {
            font-size: 0.85rem;
            font-weight: 900;
            opacity: 0;
            color: var(--blue-primary);
        }
        .theme-option-btn.active-theme .theme-check-mark {
            opacity: 1;
        }
        .theme-dots {
            display: flex;
            align-items: center;
            gap: 5px;
            background: var(--input-bg);
            padding: 4px 8px;
            border-radius: 999px;
            border: 1px solid var(--gray-border);
        }
        .theme-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid rgba(0, 0, 0, 0.2);
        }
        .settings-divider {
            height: 1px;
            background: var(--gray-border);
            margin: 12px 0;
        }
        .retired-menu-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 14px;
            border-radius: 12px;
            border: 1.5px solid var(--blue-primary);
            background: var(--blue-light);
            color: var(--blue-header);
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .retired-menu-btn:hover {
            background: var(--blue-primary);
            color: #ffffff;
        }
        .retired-count-badge {
            background: var(--blue-primary);
            color: #ffffff;
            font-size: 0.8rem;
            padding: 2px 10px;
            border-radius: 999px;
            font-weight: 800;
            min-width: 28px;
            text-align: center;
        }
        .retired-menu-btn:hover .retired-count-badge {
            background: #ffffff;
            color: var(--blue-primary);
        }

        /* نافذة الموظفين خارج الخدمة */
        .retired-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(3px);
            z-index: 60000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }
        .hidden-modal {
            display: none !important;
        }
        .retired-modal-card {
            background: var(--card-bg);
            color: var(--text-main);
            width: 100%;
            max-width: 740px;
            max-height: 86vh;
            border-radius: 16px;
            border: 1px solid var(--gray-border);
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .retired-modal-header {
            background: var(--header-gradient);
            color: #ffffff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 800;
            font-size: 1rem;
        }
        .retired-close-btn {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 8px;
            padding: 4px 12px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
        }
        .retired-close-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }
        .retired-modal-body {
            padding: 14px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .retired-summary-bar {
            background: var(--blue-light);
            border: 1px solid var(--gray-border);
            color: var(--blue-header);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.84rem;
            font-weight: 700;
        }
        .retired-search-box input {
            width: 100%;
            padding: 8px 12px;
            border: 1.5px solid var(--gray-border);
            border-radius: 10px;
            font-size: 0.9rem;
            background: var(--input-bg);
            color: var(--blue-header);
            font-weight: 800;
        }
        .retired-search-box input:focus {
            outline: none;
            border-color: var(--blue-primary);
            box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.15);
        }
        .retired-list-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .retired-list-item {
            background: var(--gray-light);
            border: 1px solid var(--gray-border);
            border-radius: 10px;
            padding: 10px 13px;
            cursor: pointer;
            transition: all 0.16s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .retired-list-item:hover {
            border-color: var(--blue-primary);
            background: var(--blue-light);
        }
        .retired-item-name {
            font-weight: 800;
            font-size: 0.92rem;
            color: var(--blue-header);
        }
        .retired-item-payid {
            font-weight: 800;
            font-size: 0.85rem;
            color: var(--text-main);
            background: var(--input-bg);
            border: 1px solid var(--gray-border);
            padding: 3px 9px;
            border-radius: 8px;
            flex-shrink: 0;
        }

        #fileStatus {
            text-align: center;
            font-size: 0.82rem;
            color: var(--blue-header);
            margin-bottom: 12px;
            font-weight: 700;
            background: var(--blue-light);
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--gray-border);
        }

        .section-box {
            border-radius: 12px;
            padding: 14px 16px;
            border: 1px solid var(--gray-border);
            background: var(--gray-light);
        }

        .section-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 2px dashed var(--gray-border);
        }

        .section-title { 
            color: var(--blue-header); 
            font-weight: 800; 
            font-size: 1.05rem; 
        }

        .action-btns-group {
            display: flex;
            gap: 8px;
        }

        /* زر التعديل والحفظ الأخضر */
        .btn-save-green {
            background: var(--green-light);
            color: var(--green-text);
            border: 1px solid var(--green-border);
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-save-green:hover {
            background: var(--green-hover);
            transform: translateY(-1px);
        }

        /* زر تفريغ البيانات الوردي الصغير */
        .btn-clear-pink {
            background: var(--pink-light);
            color: var(--pink-text);
            border: 1px solid var(--pink-border);
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-clear-pink:hover {
            background: var(--pink-hover);
            transform: translateY(-1px);
        }
        
        .input-group { margin-bottom: 8px; position: relative; }
        .input-group:last-child { margin-bottom: 0; }
        
        label { 
            display: block; 
            margin-bottom: 3px; 
            font-size: 0.82rem; 
            color: var(--text-main); 
            font-weight: 700; 
        }
        input { 
            width: 100%; 
            padding: 7px 10px; 
            border: 1px solid var(--gray-border); 
            border-radius: 8px; 
            font-size: 0.92rem; 
            background: var(--input-bg); 
            color: var(--blue-header);
            font-weight: 800;
            transition: all 0.2s ease;
        }
        input:focus {
            outline: none;
            border-color: var(--blue-primary);
            box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.15);
        }
        input.status-retired {
            color: var(--pink-text);
            background: var(--pink-light);
            border-color: var(--pink-border);
        }
        input.status-active {
            color: var(--green-text);
            background: var(--green-light);
            border-color: var(--green-border);
        }

        /* تنسيق حقل التليفون مع أزرار الاتصال والواتساب */
        .phone-input-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .contact-action-btn {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            flex-shrink: 0;
            border: 1px solid var(--gray-border);
            transition: all 0.2s ease;
        }
        .btn-call-phone {
            background: var(--blue-light);
            color: var(--blue-primary);
            border-color: var(--blue-primary);
        }
        .btn-call-phone:hover {
            background: var(--blue-primary);
            color: #ffffff;
            transform: translateY(-1px);
        }
        .btn-whatsapp-phone {
            background: var(--green-light);
            color: var(--green-text);
            border-color: var(--green-border);
        }
        .btn-whatsapp-phone:hover {
            background: #16a34a;
            color: #ffffff;
            border-color: #16a34a;
            transform: translateY(-1px);
        }

        /* تنسيق حقل رقم الصرف مع أزرار الأسهم الدائرية */
        .payid-input-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .arrow-circle-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--blue-light);
            border: 1px solid var(--blue-primary);
            color: var(--blue-header);
            font-size: 1.1rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            flex-shrink: 0;
        }
        .arrow-circle-btn:hover {
            background: var(--blue-primary);
            color: #ffffff;
            transform: scale(1.08);
        }

        /* القائمة المنسدلة الذكية - تظهر لأعلى */
        .custom-dropdown {
            position: absolute;
            bottom: 100%;
            left: 0;
            right: 0;
            max-height: 150px;
            overflow-y: auto;
            background: var(--dropdown-bg);
            border: 1px solid var(--gray-border);
            border-radius: 8px;
            z-index: 9999;
            box-shadow: 0 -8px 20px rgba(0, 0, 0, 0.15);
            margin-bottom: 4px;
        }
        .dropdown-item {
            padding: 7px 10px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-main);
            font-weight: 700;
            border-bottom: 1px solid var(--dropdown-border-bottom);
            transition: background 0.15s;
        }
        .dropdown-item:hover {
            background: var(--blue-light);
            color: var(--blue-primary);
        }
        .dropdown-item:last-child {
            border-bottom: none;
        }
        .hidden-dropdown {
            display: none !important;
        }

        @media (max-width: 640px) {
            body { padding: 8px; }
            .app-card { padding: 12px; }
            .main-header-box { padding: 10px 42px; }
            .main-header-title { font-size: 1.05rem; }
            input { padding: 6px 8px; font-size: 0.88rem; }
        }
    </style>
</head>
<body>

<div class="app-card">
    <!-- العنوان الرئيسي المدمج بشرط الإضافة بالإكسيل -->
    <div class="main-header-box" title="انقر لإضافة/تحديث ملف بيانات الإكسيل">
        <input type="file" accept=".xlsx, .xls" id="excelInput" onchange="importEmployeeExcel(event)">
        <button type="button" class="settings-gear-btn" id="settingsGearBtn" onclick="toggleSettingsMenu(event)" title="الإعدادات والسمات والمعاشات">&#9881;</button>
        <div class="add-badge">+ إضافة ملف إكسيل</div>
        <div class="main-header-title">بيانات العاملين شركة الدلتا للسكر</div>
    </div>

    <div id="fileStatus">جاري التحقق من بيانات العاملين...</div>

    <!-- قسم بيانات العامل الرئيسي -->
    <div class="section-box">
        <div class="section-header-row">
            <div class="section-title">بيانات العامل</div>
            <div class="action-btns-group">
                <button type="button" class="btn-save-green" onclick="saveEmployeeChanges()">حفظ التعديلات</button>
                <button type="button" class="btn-clear-pink" onclick="clearAllData()">تفريغ البيانات</button>
            </div>
        </div>
        
        <!-- 1. اسم الموظف -->
        <div class="input-group">
            <label>اسم الموظف (ابحث بأي اسم أو كلمات متفرقة):</label>
            <input type="text" id="empName" placeholder="أدخل اسم الموظف..." autocomplete="off" oninput="filterDropdown('empName', 'empName_dropdown')" onfocus="filterDropdown('empName', 'empName_dropdown')">

<script>
let globalEmployeesData = [];
let sortedEmployeeIndices = []; 
let currentSortedIndex = -1;

function applyTheme(themeName) {
    document.body.setAttribute('data-theme', themeName);
    try {
        localStorage.setItem('deltaSugarSelectedTheme', themeName);
    } catch (e) {}

    var btns = document.querySelectorAll('.theme-option-btn');
    btns.forEach(function(btn) {
        if (btn.getAttribute('data-theme-val') === themeName) {
            btn.classList.add('active-theme');
        } else {
            btn.classList.remove('active-theme');
        }
    });
}

try {
    var savedTheme = localStorage.getItem('deltaSugarSelectedTheme');
    if (savedTheme) {
        applyTheme(savedTheme);
    }
} catch (e) {}

function toggleSettingsMenu(event) {
    event.stopPropagation();
    closeAllDropdowns();
    updateRetiredBadge();
    var backdrop = document.getElementById('settingsMenuBackdrop');
    backdrop.classList.toggle('hidden-menu');
}

function closeSettingsMenu() {
    var backdrop = document.getElementById('settingsMenuBackdrop');
    if (backdrop) backdrop.classList.add('hidden-menu');
}

try {
    let saved = localStorage.getItem('deltaSugarEmployeesData');
    if (saved) {
        globalEmployeesData = JSON.parse(saved);
        sortEmployeesByPayId();
        updateRetiredBadge();
        document.getElementById('fileStatus').innerText = "تم تحميل بيانات العاملين بنجاح (" + globalEmployeesData.length + " موظفاً محفوظين بالبرنامج)";
    } else {
        document.getElementById('fileStatus').innerText = "انقر فوق الشريط الأزرق بالأعلى لرفع ملف الإكسيل وحفظه بالبرنامج";
    }
} catch(e) {
    globalEmployeesData = [];
}

function sortEmployeesByPayId() {
    sortedEmployeeIndices = globalEmployeesData.map(function(emp, index) {
        var pIdRaw = getVal(emp, ['رقم الصرف', 'رقم_الصرف', 'PayID', 'كود الصرف']);
        var pIdNum = parseInt(pIdRaw.toString().replace(/\D/g, ''), 10);
        return {
            originalIndex: index,
            payIdNum: isNaN(pIdNum) ? Infinity : pIdNum,
            rawPayId: pIdRaw
        };
    });

    sortedEmployeeIndices.sort(function(a, b) {
        return a.payIdNum - b.payIdNum;
    });
}

function normalizeArabic(text) {
    if (text === undefined || text === null) return "";
    return text
        .toString()
        .replace(/[\u064B-\u0652]/g, "") 
        .replace(/[أإآا]/g, "ا")       
        .replace(/ى/g, "ي")            
        .replace(/ة/g, "ه")            
        .replace(/\s+/g, "")           
        .trim()
        .toLowerCase();
}

function cleanPhone(phone) {
    if (!phone) return "";
    var cleaned = phone.toString().replace(/\D/g, "").trim();
    if (cleaned.length === 10 && !cleaned.startsWith('0')) {
        cleaned = '0' + cleaned;
    }
    return cleaned;
}

function normalizeKeyName(keyName) {
    if (!keyName) return "";
    return keyName
        .toString()
        .replace(/[\u064B-\u0652]/g, "")
        .replace(/[أإآا]/g, "ا")
        .replace(/ى/g, "ي")
        .replace(/ة/g, "ه")
        .replace(/\s+/g, "")
        .trim()
        .toLowerCase();
}

function getVal(emp, keys) {
    if (!emp || typeof emp !== 'object') return "";
    for (var k = 0; k < keys.length; k++) {
        var key = keys[k];
        if (emp[key] !== undefined && emp[key] !== null && emp[key].toString().trim() !== "") {
            return emp[key].toString().trim();
        }
    }
    var normalizedCandidates = keys.map(function(k) { return normalizeKeyName(k); });
    var actualKeys = Object.keys(emp);
    for (var a = actualKeys.length - 1; a >= 0; a--) {
        var normActual = normalizeKeyName(actualKeys[a]);
        if (normalizedCandidates.indexOf(normActual) !== -1) {
            var val = emp[actualKeys[a]];
            if (val !== undefined && val !== null && val.toString().trim() !== "") {
                return val.toString().trim();
            }
        }
    }
    return "";
}

function getEmpData(emp) {
    return {
        name: getVal(emp, ['اسم الموظف', 'الاسم', 'Name', 'اسم العامل']),
        payId: getVal(emp, ['رقم الصرف', 'رقم_الصرف', 'PayID', 'كود الصرف']),
        natId: getVal(emp, ['الرقم القومي', 'الرقم_القومي', 'NatID', 'الرقم القومى']),
        jobTitle: getVal(emp, ['الوظيفة', 'الوظيفه']),
        phone: cleanPhone(getVal(emp, ['رقم التليفون', 'رقم الهاتف', 'الهاتف', 'التليفون', 'Phone', 'Mobile'])),
        costCenter: getVal(emp, ['مركز التكلفة', 'مركز_التكلفة', 'CostCenter', 'مركز تكلفة']),
        deptCode: getVal(emp, ['كود الإدارة', 'كود_الإدارة', 'كود الادارة', 'DeptCode', 'الإدارة', 'الادارة'])
    };
}

function formatArabicDateDMY(dateObj) {
    var d = dateObj.getDate();
    var m = dateObj.getMonth() + 1;
    var y = dateObj.getFullYear();
    return d + "/" + m + "/" + y;
}

function pad2(num) {
    return num < 10 ? "0" + num : "" + num;
}

function getPensionCutoffPrefix(referenceDate) {
    var now = referenceDate || new Date();
    var cutoffBirthYear = now.getFullYear() - 60;
    var monthStr = pad2(now.getMonth() + 1);
    var dayStr = pad2(now.getDate());

    var centuryDigit = "";
    var twoDigitYear = "";

    if (cutoffBirthYear >= 2000 && cutoffBirthYear <= 2099) {
        centuryDigit = "3";
        twoDigitYear = pad2(cutoffBirthYear - 2000);
    } else if (cutoffBirthYear >= 1900 && cutoffBirthYear <= 1999) {
        centuryDigit = "2";
        twoDigitYear = pad2(cutoffBirthYear - 1900);
    } else if (cutoffBirthYear >= 1800 && cutoffBirthYear <= 1899) {
        centuryDigit = "1";
        twoDigitYear = pad2(cutoffBirthYear - 1800);
    } else {
        return null;
    }

    return {
        cutoffPrefixStr: centuryDigit + twoDigitYear + monthStr + dayStr,
        cutoffPrefixNum: parseInt(centuryDigit + twoDigitYear + monthStr + dayStr, 10),
        cutoffBirthDate: new Date(cutoffBirthYear, now.getMonth(), now.getDate())
    };
}

function evaluatePensionByNationalId(natIdRaw, referenceDate) {
    if (!natIdRaw) return null;
    var digits = natIdRaw.toString().replace(/\D/g, "").trim();
    if (digits.length < 7) return null;

    var prefix7Str = digits.substr(0, 7);
    var prefix7Num = parseInt(prefix7Str, 10);
    if (isNaN(prefix7Num)) return null;

    var cutoff = getPensionCutoffPrefix(referenceDate);
    if (!cutoff) return null;

    var centuryDigit = prefix7Str.charAt(0);
    var centuryBase = centuryDigit === "3" ? 2000 : (centuryDigit === "2" ? 1900 : (centuryDigit === "1" ? 1800 : 0));
    if (!centuryBase) return null;

    var yy = parseInt(prefix7Str.substr(1, 2), 10);
    var mm = parseInt(prefix7Str.substr(3, 2), 10);
    var dd = parseInt(prefix7Str.substr(5, 2), 10);
    var birthYear = centuryBase + yy;
    var birthDate = new Date(birthYear, mm - 1, dd);
    var pensionDate = new Date(birthYear + 60, mm - 1, dd);

    var isOutOfService = prefix7Num <= cutoff.cutoffPrefixNum;

    return {
        prefix7Str: prefix7Str,
        prefix7Num: prefix7Num,
        cutoffPrefixStr: cutoff.cutoffPrefixStr,
        birthDateStr: formatArabicDateDMY(birthDate),
        pensionDateStr: formatArabicDateDMY(pensionDate),
        isOutOfService: isOutOfService
    };
}

function updateJobStatusField(natIdVal) {
    var statusInput = document.getElementById('jobStatus');
    if (!statusInput) return;

    statusInput.classList.remove('status-retired', 'status-active');
    var cleanNat = (natIdVal || "").toString().replace(/\D/g, "").trim();
    if (!cleanNat) {
        statusInput.value = "";
        return;
    }

    var info = evaluatePensionByNationalId(cleanNat, new Date());
    if (!info) {
        statusInput.value = "";
        return;
    }

    if (info.isOutOfService) {
        statusInput.value = "خارج خدمة";
        statusInput.classList.add('status-retired');
    } else {
        statusInput.value = "مازال بالخدمة";
        statusInput.classList.add('status-active');
    }
}

function handlePayIdInput() {
    var rawPay = document.getElementById('payId').value.trim();
    filterDropdown('payId', 'payId_dropdown');

    if (!rawPay) {
        updateJobStatusField("");
        return;
    }

    var normPay = normalizeArabic(rawPay);
    var matchedEmp = null;
    for (var i = 0; i < globalEmployeesData.length; i++) {
        var d = getEmpData(globalEmployeesData[i]);
        if (normalizeArabic(d.payId) === normPay) {
            matchedEmp = d;
            break;
        }
    }

    if (matchedEmp && matchedEmp.natId) {
        updateJobStatusField(matchedEmp.natId);
    } else {
        updateJobStatusField(document.getElementById('natId').value);
    }
}

function handleNatIdInput() {
    filterDropdown('natId', 'natId_dropdown');
    updateJobStatusField(document.getElementById('natId').value);
}

function getRetiredEmployeesList() {
    var list = [];
    var now = new Date();
    for (var i = 0; i < globalEmployeesData.length; i++) {
        var emp = globalEmployeesData[i];
        var d = getEmpData(emp);
        var pensionInfo = evaluatePensionByNationalId(d.natId, now);
        if (pensionInfo && pensionInfo.isOutOfService) {
            list.push({
                originalIndex: i,
                emp: emp,
                data: d,
                pension: pensionInfo
            });
        }
    }
    return list;
}

function updateRetiredBadge() {
    var badge = document.getElementById('retiredBadgeCount');
    if (!badge) return;
    var retiredList = getRetiredEmployeesList();
    badge.innerText = retiredList.length;
}

function renderRetiredList() {
    var retiredList = getRetiredEmployeesList();
    var searchInputEl = document.getElementById('retiredSearchInput');
    var container = document.getElementById('retiredListContainer');
    if (!container) return;

    var rawQuery = searchInputEl ? searchInputEl.value : "";
    var cleanQuery = normalizeArabic(rawQuery);
    var queryWords = rawQuery.trim().split(/\s+/).map(function(w) { return normalizeArabic(w); }).filter(function(w) { return w.length > 0; });

    var filtered = retiredList.filter(function(item) {
        if (!cleanQuery) return true;
        var d = item.data;
        var normName = normalizeArabic(d.name);
        var normPay = normalizeArabic(d.payId);
        var nameMatches = normName.includes(cleanQuery) || queryWords.every(function(word) { return normName.includes(word); });
        var payMatches = normPay.includes(cleanQuery);
        return nameMatches || payMatches;
    });

    if (retiredList.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:22px; font-weight:700;">لا يوجد موظفون خارج الخدمة حالياً بناءً على تاريخ اليوم والرقم القومي.</div>';
        return;
    }

    if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:22px; font-weight:700;">لا توجد نتائج مطابقة للبحث ضمن الموظفين خارج الخدمة.</div>';
        return;
    }

    var cardsHtml = "";
    for (var i = 0; i < filtered.length; i++) {
        var item = filtered[i];
        var d = item.data;
        cardsHtml += '<div class="retired-list-item" onclick="selectRetiredEmployee(' + item.originalIndex + ')">' +
            '<div class="retired-item-name">' + (d.name || 'بدون اسم') + '</div>' +
            '<div class="retired-item-payid">رقم الصرف: ' + (d.payId || 'غير مسجل') + '</div>' +
        '</div>';
    }

    container.innerHTML = cardsHtml;
}

function openRetiredModal() {
    closeSettingsMenu();
    var now = new Date();
    var todayStr = formatArabicDateDMY(now);
    var cutoff = getPensionCutoffPrefix(now);
    var retiredList = getRetiredEmployeesList();

    var summaryBar = document.getElementById('retiredSummaryBar');
    if (summaryBar) {
        summaryBar.innerText =
            'تاريخ اليوم: ' + todayStr +
            (cutoff ? ' | حد المعاش (من الشمال فأقل): ' + cutoff.cutoffPrefixStr : '') +
            ' | إجمالي الموظفين خارج الخدمة: ' + retiredList.length;
    }

    var searchInputEl = document.getElementById('retiredSearchInput');
    if (searchInputEl) {
        searchInputEl.value = "";
    }

    renderRetiredList();
    document.getElementById('retiredModalBackdrop').classList.remove('hidden-modal');
}

function closeRetiredModal() {
    document.getElementById('retiredModalBackdrop').classList.add('hidden-modal');
}

function selectRetiredEmployee(originalIndex) {
    if (globalEmployeesData[originalIndex]) {
        fillEmployeeData(globalEmployeesData[originalIndex], originalIndex);
        closeRetiredModal();
    }
}

function callCurrentPhone() {
    var rawPhone = document.getElementById('phone').value.trim();
    var cleaned = cleanPhone(rawPhone);
    if (!cleaned) {
        alert("لا يوجد رقم تليفون مسجل للاتصال!");
        return;
    }
    window.location.href = "tel:" + cleaned;
}

function openWhatsAppCurrentPhone() {
    var rawPhone = document.getElementById('phone').value.trim();
    var cleaned = cleanPhone(rawPhone);
    if (!cleaned) {
        alert("لا يوجد رقم تليفون مسجل لفتح واتساب!");
        return;
    }
    var waNumber = cleaned;
    if (waNumber.length === 11 && waNumber.startsWith('0')) {
        waNumber = "2" + waNumber;
    } else if (waNumber.length === 10 && !waNumber.startsWith('2')) {
        waNumber = "20" + waNumber;
    }
    window.open("https://wa.me/" + waNumber, "_blank");
}

function importEmployeeExcel(event) {
    var file = event.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        var data = new Uint8Array(e.target.result);
        var workbook = XLSX.read(data, {type: 'array'});
        var firstSheetName = workbook.SheetNames[0];
        var worksheet = workbook.Sheets[firstSheetName];
        
        globalEmployeesData = XLSX.utils.sheet_to_json(worksheet, {defval: ""});
        localStorage.setItem('deltaSugarEmployeesData', JSON.stringify(globalEmployeesData));
        sortEmployeesByPayId();
        updateRetiredBadge();
        
        document.getElementById('fileStatus').innerText = "تم حفظ وتثبيت بيانات الـ " + globalEmployeesData.length + " موظفاً بنجاح!";
        alert("تم حفظ بيانات العاملين بداخل البرنامج بنجاح!");
    };
    reader.readAsArrayBuffer(file);
}

function filterDropdown(inputId, dropdownId) {
    var rawInput = document.getElementById(inputId).value;
    var dropdown = document.getElementById(dropdownId);
    
    if (globalEmployeesData.length === 0 || rawInput.trim() === "") {
        dropdown.classList.add('hidden-dropdown');
        return;
    }

    var cleanQuery = normalizeArabic(rawInput);
    var queryWords = rawInput.trim().split(/\s+/).map(function(w) { return normalizeArabic(w); }).filter(function(w) { return w.length > 0; });
    
    dropdown.innerHTML = "";
    var matches = 0;

    for (var i = 0; i < globalEmployeesData.length; i++) {
        var emp = globalEmployeesData[i];
        var d = getEmpData(emp);
        var isMatch = false;

        if (inputId === 'empName') {
            var normName = normalizeArabic(d.name);
            var directMatch = normName.includes(cleanQuery);
            var wordsMatch = queryWords.every(function(word) { return normName.includes(word); });
            isMatch = directMatch || wordsMatch;
        } else if (inputId === 'payId') {
            isMatch = normalizeArabic(d.payId).includes(cleanQuery);
        } else if (inputId === 'natId') {
            isMatch = normalizeArabic(d.natId).includes(cleanQuery);
        } else if (inputId === 'jobTitle') {
            isMatch = normalizeArabic(d.jobTitle).includes(cleanQuery);
        } else if (inputId === 'phone') {
            isMatch = normalizeArabic(d.phone).includes(cleanQuery);
        } else if (inputId === 'costCenter') {
            isMatch = normalizeArabic(d.costCenter).includes(cleanQuery);
        } else if (inputId === 'deptCode') {
            isMatch = normalizeArabic(d.deptCode).includes(cleanQuery);
        }

        if (isMatch) {
            var div = document.createElement('div');
            div.className = 'dropdown-item';
            div.innerText = (d.name || "بدون اسم") + 
                            (d.payId ? " | رقم الصرف: " + d.payId : "") + 
                            (d.jobTitle ? " | الوظيفة: " + d.jobTitle : "") + 
                            (d.costCenter ? " | مركز التكلفة: " + d.costCenter : "") + 
                            (d.deptCode ? " | كود الإدارة: " + d.deptCode : "");
            
            div.onclick = (function(empObj, index) {
                return function() {
                    fillEmployeeData(empObj, index);
                    closeAllDropdowns();
                };
            })(emp, i);

            dropdown.appendChild(div);
            matches++;
            if (matches >= 40) break;
        }
    }

    if (matches > 0) dropdown.classList.remove('hidden-dropdown');
    else dropdown.classList.add('hidden-dropdown');
}

function fillEmployeeData(empObj, originalIndex) {
    var d = getEmpData(empObj);
    document.getElementById('empName').value = d.name;
    document.getElementById('payId').value = d.payId;
    document.getElementById('natId').value = d.natId;
    document.getElementById('jobTitle').value = d.jobTitle;
    document.getElementById('phone').value = d.phone;
    document.getElementById('costCenter').value = d.costCenter;
    document.getElementById('deptCode').value = d.deptCode;
    updateJobStatusField(d.natId);

    for (var s = 0; s < sortedEmployeeIndices.length; s++) {
        if (sortedEmployeeIndices[s].originalIndex === originalIndex) {
            currentSortedIndex = s;
            break;
        }
    }
}

function navigateEmployee(direction) {
    if (globalEmployeesData.length === 0) {
        alert("لا توجد بيانات موظفين مسجلة بالبرنامج حالياً!");
        return;
    }

    if (sortedEmployeeIndices.length === 0) {
        sortEmployeesByPayId();
    }

    if (currentSortedIndex === -1) {
        currentSortedIndex = 0;
    } else {
        currentSortedIndex += direction;
        if (currentSortedIndex >= sortedEmployeeIndices.length) {
            currentSortedIndex = 0;
        } else if (currentSortedIndex < 0) {
            currentSortedIndex = sortedEmployeeIndices.length - 1;
        }
    }

    var targetOriginalIndex = sortedEmployeeIndices[currentSortedIndex].originalIndex;
    var empObj = globalEmployeesData[targetOriginalIndex];
    fillEmployeeData(empObj, targetOriginalIndex);
}

function saveEmployeeChanges() {
    var empName = document.getElementById('empName').value.trim();
    var payId = document.getElementById('payId').value.trim();
    var natId = document.getElementById('natId').value.trim();
    var jobTitle = document.getElementById('jobTitle').value.trim();
    var phone = document.getElementById('phone').value.trim();
    var costCenter = document.getElementById('costCenter').value.trim();
    var deptCode = document.getElementById('deptCode').value.trim();

    if (!empName && !payId) {
        alert("برجاء اختيار موظف وتحديد بياناته أولاً لحفظ التعديل!");
        return;
    }

    var targetIndex = -1;
    if (currentSortedIndex !== -1 && sortedEmployeeIndices[currentSortedIndex]) {
        targetIndex = sortedEmployeeIndices[currentSortedIndex].originalIndex;
    }

    if (targetIndex === -1 && globalEmployeesData.length > 0) {
        for (var i = 0; i < globalEmployeesData.length; i++) {
            var d = getEmpData(globalEmployeesData[i]);
            if ((payId && d.payId === payId) || (empName && normalizeArabic(d.name) === normalizeArabic(empName))) {
                targetIndex = i;
                break;
            }
        }
    }

    if (targetIndex !== -1) {
        var empObj = globalEmployeesData[targetIndex];
        empObj['اسم الموظف'] = empName;
        empObj['رقم الصرف'] = payId;
        empObj['الرقم القومي'] = natId;
        empObj['الوظيفة'] = jobTitle;
        empObj['رقم التليفون'] = phone;
        empObj['مركز التكلفة'] = costCenter;
        empObj['كود الإدارة'] = deptCode;
    } else {
        var newEmpObj = {
            'اسم الموظف': empName,
            'رقم الصرف': payId,
            'الرقم القومي': natId,
            'الوظيفة': jobTitle,
            'رقم التليفون': phone,
            'مركز التكلفة': costCenter,
            'كود الإدارة': deptCode
        };
        globalEmployeesData.push(newEmpObj);
        targetIndex = globalEmployeesData.length - 1;
    }

    localStorage.setItem('deltaSugarEmployeesData', JSON.stringify(globalEmployeesData));
    sortEmployeesByPayId();
    updateRetiredBadge();
    fillEmployeeData(globalEmployeesData[targetIndex], targetIndex);
    
    alert("تم حفظ التعديلات الجديدة بشكل دائم ولن تتغير أبداً!");
    document.getElementById('fileStatus').innerText = "تم حفظ وتثبيت بيانات الـ " + globalEmployeesData.length + " موظفاً بنجاح!";
}

function clearAllData() {
    currentSortedIndex = -1;
    document.getElementById('empName').value = "";
    document.getElementById('payId').value = "";
    document.getElementById('natId').value = "";
    document.getElementById('jobTitle').value = "";
    document.getElementById('phone').value = "";
    document.getElementById('costCenter').value = "";
    document.getElementById('deptCode').value = "";
    updateJobStatusField("");
    closeAllDropdowns();
}

function closeAllDropdowns() {
    var dropdowns = document.querySelectorAll('.custom-dropdown');
    dropdowns.forEach(function(d) { d.classList.add('hidden-dropdown'); });
}

document.addEventListener('click', function(e) {
    if (!e.target.closest('.input-group')) {
        closeAllDropdowns();
    }
});
</script>
